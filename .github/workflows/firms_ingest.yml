name: FIRMS Ingestion Pipeline

on:
  schedule:
    - cron: '0 */3 * * *'   # Every 3 hours (UTC)
  workflow_dispatch:          # Manual trigger from Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Health check — backend reachable
        run: |
          if [ -n "${{ secrets.BACKEND_API_URL }}" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              ${{ secrets.BACKEND_API_URL }}/api/v1/health || echo "000")
            if [ "$STATUS" != "200" ]; then
              echo "::warning::Backend unreachable (HTTP $STATUS) — proceeding with direct DB ingestion"
            else
              echo "Backend healthy ($STATUS)"
            fi
          else
            echo "::notice::BACKEND_API_URL secret not set — proceeding with direct DB ingestion"
          fi

      - name: Health check — Ollama tunnel reachable
        run: |
          if [ -n "${{ secrets.OLLAMA_BASE_URL }}" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              ${{ secrets.OLLAMA_BASE_URL }}/api/tags || echo "000")
            if [ "$STATUS" != "200" ]; then
              echo "::warning::Ollama unreachable — pipeline will use rule-based fallback"
            fi
          fi

      - name: Train XGBoost Model Artifact
        env:
          PYTHONPATH: .
        run: python ml/train.py --version 1.0.0

      - name: Run FIRMS ingestion + triage
        env:
          PYTHONPATH: backend
          API_KEY: ${{ secrets.API_KEY || secrets.BACKEND_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_SECRET: ${{ secrets.CLOUDFLARE_R2_SECRET }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python backend/scripts/ingest_firms.py

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: ingest
    if: failure()
    steps:
      - name: Send Telegram failure alert
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST \
              "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHANNEL_ID }}" \
              --data-urlencode "text=⚠️ AERO-FLARE PIPELINE FAILURE: FIRMS ingestion job failed. Run ID: ${{ github.run_id }}"
          fi
